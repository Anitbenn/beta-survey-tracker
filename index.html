<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beta Survey Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --color-bg: #f4f5f7;
    --color-surface: #ffffff;
    --color-text: #172b4d;
    --color-text-secondary: #44546f;
    --color-text-muted: #8993a4;
    --color-border: #dfe1e6;
    --color-border-light: #ebecf0;
    --color-primary: #0052CC;
    --color-primary-hover: #0747a6;
    --color-primary-light: #deebff;
    --color-success: #36b37e;
    --color-success-bg: #e3fcef;
    --color-error: #de350b;
    --color-error-bg: #ffebe6;
    --color-warning: #ff991f;
    --color-warning-bg: #fffae6;
    --color-hover: rgba(9, 30, 66, 0.04);
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    --font-mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-pill: 100px;
    --shadow-sm: 0 1px 3px rgba(9,30,66,0.08);
    --shadow-md: 0 4px 12px rgba(9,30,66,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--color-bg);
    font-family: var(--font-sans);
    color: var(--color-text);
    min-height: 100vh;
    padding: 40px 20px;
  }

  .container { max-width: 700px; margin: 0 auto; }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 36px; }
  .header-icon {
    width: 56px; height: 56px; margin: 0 auto 14px;
    background: var(--color-primary-light);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--color-primary);
  }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
  .header p { color: var(--color-text-secondary); font-size: 14px; margin-top: 6px; }

  /* ── Search bar ── */
  .search-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 6px 6px 6px 18px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
    margin-bottom: 28px;
  }
  .search-card:focus-within {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(0,82,204,0.12);
  }
  .search-card i.search-icon { color: var(--color-text-muted); font-size: 15px; flex-shrink: 0; }
  .search-card input {
    flex: 1; border: none; outline: none; font-size: 15px;
    font-family: var(--font-mono); color: var(--color-text);
    background: transparent; padding: 10px 0;
    min-width: 0;
  }
  .search-card input::placeholder { color: var(--color-text-muted); font-family: var(--font-sans); }
  .search-btn {
    background: var(--color-primary); color: #fff; border: none;
    border-radius: var(--radius-md); padding: 10px 22px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
    transition: background 0.15s;
  }
  .search-btn:hover { background: var(--color-primary-hover); }
  .search-btn:disabled { opacity: 0.6; cursor: default; }

  /* ── Status bar ── */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding: 0 2px;
  }
  .status-bar .user-info { font-size: 14px; color: var(--color-text-secondary); }
  .status-bar .user-info strong { color: var(--color-text); font-family: var(--font-mono); }
  .status-bar .overall { font-size: 13px; font-weight: 600; color: var(--color-text-muted); }

  /* ── Program card ── */
  .program {
    background: var(--color-surface);
    border: 1px solid var(--color-border-light);
    border-radius: var(--radius-lg);
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .program-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; cursor: pointer; user-select: none;
    transition: background 0.1s;
  }
  .program-header:hover { background: var(--color-hover); }
  .program-title { font-size: 15px; font-weight: 600; }
  .program-meta { display: flex; align-items: center; gap: 12px; }
  .progress-mini { width: 56px; height: 5px; background: var(--color-border-light); border-radius: 3px; overflow: hidden; }
  .progress-mini-fill { height: 100%; background: var(--color-success); border-radius: 3px; transition: width 0.4s ease; }
  .program-score { font-size: 12px; font-weight: 700; font-family: var(--font-mono); color: var(--color-text-muted); }
  .program-score.done { color: var(--color-success); }
  .chevron { color: var(--color-text-muted); font-size: 12px; transition: transform 0.2s; }
  .program.open .chevron { transform: rotate(180deg); }
  .program-body { display: none; border-top: 1px solid var(--color-border-light); }
  .program.open .program-body { display: block; }

  /* ── Survey row ── */
  .survey-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 20px;
    border-bottom: 1px solid var(--color-border-light);
    transition: background 0.1s;
  }
  .survey-row:last-child { border-bottom: none; }
  .survey-row:hover { background: var(--color-hover); }
  .survey-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .survey-icon { font-size: 16px; flex-shrink: 0; }
  .survey-icon.done { color: var(--color-success); }
  .survey-icon.pending { color: var(--color-border); }
  .survey-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .survey-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .tag {
    font-size: 11px; font-weight: 600; padding: 3px 10px;
    border-radius: var(--radius-pill); font-family: var(--font-mono);
    white-space: nowrap;
  }
  .tag.done      { background: var(--color-success-bg); color: #006644; }
  .tag.overdue   { background: var(--color-error-bg);   color: var(--color-error); }
  .tag.upcoming  { background: var(--color-warning-bg); color: #946500; }
  .tag.future    { background: #f0f0f3; color: var(--color-text-muted); }

  /* ── Empty state ── */
  .empty-state {
    text-align: center; padding: 64px 20px; color: var(--color-text-muted);
  }
  .empty-state i { font-size: 44px; display: block; margin-bottom: 14px; color: var(--color-border); }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ── Not-found state ── */
  .not-found {
    text-align: center; padding: 40px 20px; color: var(--color-text-muted);
    background: var(--color-surface); border-radius: var(--radius-lg);
    border: 1px solid var(--color-border-light);
  }
  .not-found i { font-size: 32px; display: block; margin-bottom: 10px; color: var(--color-border); }
  .not-found p { font-size: 14px; line-height: 1.6; }
  .not-found strong { color: var(--color-text); font-family: var(--font-mono); }

  /* ── Last-updated footer ── */
  .footer {
    text-align: center; margin-top: 24px; padding: 12px;
    font-size: 12px; color: var(--color-text-muted);
  }

  /* ── Error banner ── */
  .error-banner {
    background: var(--color-error-bg); color: var(--color-error);
    padding: 12px 16px; border-radius: var(--radius-md);
    font-size: 13px; margin-bottom: 16px; display: none;
  }

  /* ── Loading spinner ── */
  .loading { text-align: center; padding: 48px; color: var(--color-text-muted); }
  .loading i { font-size: 24px; margin-bottom: 10px; display: block; }

  /* ── Responsive ── */
  @media (max-width: 500px) {
    body { padding: 20px 12px; }
    .program-header { padding: 14px 14px; }
    .survey-row { padding: 12px 14px; }
    .survey-name { font-size: 13px; }
    .tag { font-size: 10px; padding: 2px 8px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-icon"><i class="fa-solid fa-clipboard-check"></i></div>
    <h1>Beta Survey Tracker</h1>
    <p>Check your survey completion status across all active beta programs</p>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="errorBanner"></div>

  <!-- Search -->
  <div class="search-card">
    <i class="fa-solid fa-user search-icon"></i>
    <input type="text" id="aliasInput" placeholder="Enter your alias (e.g., jsmith)" autocomplete="off" spellcheck="false">
    <button class="search-btn" id="lookupBtn">Look up</button>
  </div>

  <!-- Results area -->
  <div id="results"></div>

  <!-- Empty state (shown initially) -->
  <div class="empty-state" id="emptyState">
    <i class="fa-solid fa-magnifying-glass"></i>
    <p>Enter your alias above to see which<br>surveys you've completed.</p>
  </div>

  <!-- Footer -->
  <div class="footer" id="footer" style="display:none;"></div>

</div>

<script>
// ============================================================
//  DATA
// ============================================================
let DATA = null;     // loaded from completions.json
let DATA_LOADED = false;

// Path to the completions file — adjust if your S3 layout differs
const COMPLETIONS_URL = "completions.json";

async function loadData() {
  try {
    const resp = await fetch(COMPLETIONS_URL, { cache: "no-cache" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    DATA = await resp.json();
    DATA_LOADED = true;
  } catch (err) {
    console.error("Failed to load completions.json:", err);
    showError("Could not load survey data. Please try refreshing the page.");
  }
}

// ============================================================
//  DOM REFS
// ============================================================
const resultsDiv  = document.getElementById("results");
const emptyState  = document.getElementById("emptyState");
const errorBanner = document.getElementById("errorBanner");
const aliasInput  = document.getElementById("aliasInput");
const lookupBtn   = document.getElementById("lookupBtn");
const footer      = document.getElementById("footer");

// ============================================================
//  EVENT LISTENERS
// ============================================================
lookupBtn.addEventListener("click", lookupAlias);
aliasInput.addEventListener("keydown", e => { if (e.key === "Enter") lookupAlias(); });

// ============================================================
//  HELPERS
// ============================================================
function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.style.display = "block";
  setTimeout(() => { errorBanner.style.display = "none"; }, 8000);
}

function dueStatus(dueDate, completed) {
  if (completed) return { cls: "done", text: "Completed" };
  const now = new Date();
  const due = new Date(dueDate + "T23:59:59");
  const diff = Math.ceil((due - now) / 86400000);
  if (diff < 0)  return { cls: "overdue",  text: `${Math.abs(diff)}d overdue` };
  if (diff <= 5) return { cls: "upcoming", text: `Due in ${diff}d` };
  const formatted = new Date(dueDate + "T00:00:00")
    .toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return { cls: "future", text: `Due ${formatted}` };
}

function timeAgo(isoStr) {
  const diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
  if (diff < 60)   return "just now";
  if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} hr ago`;
  return `${Math.floor(diff / 86400)} days ago`;
}

// ============================================================
//  LOOKUP
// ============================================================
async function lookupAlias() {
  const alias = aliasInput.value.trim().toLowerCase();
  if (!alias) { showError("Please enter your alias."); return; }

  if (!DATA_LOADED) {
    lookupBtn.disabled = true;
    lookupBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    await loadData();
    lookupBtn.disabled = false;
    lookupBtn.textContent = "Look up";
    if (!DATA_LOADED) return;
  }

  emptyState.style.display = "none";
  resultsDiv.innerHTML = "";

  let totalSurveys = 0, totalDone = 0;
  const programs = DATA.programs;

  // Check if alias appears in ANY survey
  let aliasFoundAnywhere = false;
  for (const prog of programs) {
    for (const s of prog.surveys) {
      if (s.completedAliases && s.completedAliases.includes(alias)) {
        aliasFoundAnywhere = true;
      }
    }
  }

  // Build results
  let html = "";

  // Status bar
  for (const prog of programs) {
    for (const s of prog.surveys) {
      const done = s.completedAliases && s.completedAliases.includes(alias);
      totalSurveys++;
      if (done) totalDone++;
    }
  }

  html += `<div class="status-bar">
    <div class="user-info">Results for <strong>${alias}</strong></div>
    <div class="overall">${totalDone} / ${totalSurveys} completed</div>
  </div>`;

  for (const prog of programs) {
    let progDone = 0, progTotal = prog.surveys.length;
    const surveyRows = [];

    for (const s of prog.surveys) {
      const completed = s.completedAliases && s.completedAliases.includes(alias);
      if (completed) progDone++;
      const due = dueStatus(s.due, completed);

      surveyRows.push(`
        <div class="survey-row">
          <div class="survey-left">
            <span class="survey-icon ${completed ? 'done' : 'pending'}">
              <i class="fa-solid ${completed ? 'fa-circle-check' : 'fa-circle'}"></i>
            </span>
            <span class="survey-name">${s.label}</span>
          </div>
          <div class="survey-right">
            <span class="tag ${due.cls}">${due.text}</span>
          </div>
        </div>`);
    }

    const pct = Math.round((progDone / progTotal) * 100);
    const allDone = progDone === progTotal;

    html += `
      <div class="program open">
        <div class="program-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="program-title">${prog.name}</span>
          <div class="program-meta">
            <div class="progress-mini"><div class="progress-mini-fill" style="width:${pct}%"></div></div>
            <span class="program-score ${allDone ? 'done' : ''}">${progDone}/${progTotal}</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
        </div>
        <div class="program-body">${surveyRows.join("")}</div>
      </div>`;
  }

  resultsDiv.innerHTML = html;

  // Footer with last-updated
  if (DATA.lastUpdated) {
    footer.textContent = `Data last refreshed ${timeAgo(DATA.lastUpdated)}`;
    footer.style.display = "block";
  }
}

// ============================================================
//  PRE-LOAD DATA ON PAGE OPEN
// ============================================================
loadData();
</script>
</body>
</html>
